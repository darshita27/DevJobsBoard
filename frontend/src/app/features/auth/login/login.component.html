<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 fw-bold mb-4 text-center">Log in</h1>

          @if (errorMessage()) {
            <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div>
          }

          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" formControlName="username" autocomplete="username" />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" formControlName="password" autocomplete="current-password" />
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid || submitting()">
              {{ submitting() ? 'Logging in…' : 'Log in' }}
            </button>
          </form>

          <p class="text-center small text-secondary mt-3 mb-0">
            No account? <a routerLink="/register">Sign up</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
