<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 fw-bold mb-4 text-center">Create an account</h1>

          @if (errorMessage()) {
            <div class="alert alert-danger py-2 small">{{ errorMessage() }}</div>
          }

          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" formControlName="username" autocomplete="username" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="email" autocomplete="email" />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" formControlName="password" autocomplete="new-password" />
              <div class="form-text">At least 8 characters.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm password</label>
              <input type="password" class="form-control" formControlName="confirmPassword" autocomplete="new-password" />
              @if (form.errors?.['mismatch'] && form.get('confirmPassword')?.touched) {
                <div class="text-danger small mt-1">Passwords do not match.</div>
              }
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid || submitting()">
              {{ submitting() ? 'Creating account…' : 'Sign up' }}
            </button>
          </form>

          <p class="text-center small text-secondary mt-3 mb-0">
            Already have an account? <a routerLink="/login">Log in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
